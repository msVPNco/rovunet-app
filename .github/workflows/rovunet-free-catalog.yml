name: Rovunet Free v2 (encrypted, guarded)

on:
  pull_request:
    paths: ['free/**', '.github/workflows/rovunet-free-catalog.yml']
  push:
    branches: [main]
    paths: ['free/v2/**', 'free/tools/v2.py']
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install crypto dependency
        run: python3 -m pip install --disable-pip-version-check 'cryptography>=46,<47'
      - name: Check new envelopes and legacy tests
        run: |
          python3 -m unittest discover -s free/tools -p 'test_*.py' -v
          python3 free/tools/v2.py check
          python3 free/tools/publish.py --check

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - run: python3 -m pip install --disable-pip-version-check 'cryptography>=46,<47'
      - name: Sign only v2 encrypted catalog with dedicated Free key
        env:
          ROVUNET_FREE_SIGNING_KEY_PEM_B64: ${{ secrets.ROVUNET_FREE_SIGNING_KEY_PEM_B64 }}
        run: |
          test -n "$ROVUNET_FREE_SIGNING_KEY_PEM_B64" || { echo "::error::Free signer missing; refusing unsigned publication"; exit 1; }
          python3 free/tools/v2.py publish
      - name: Commit signed v2 index
        run: |
          git config user.name rovunet-free-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add free/v2/catalog.json free/v2/catalog.sig
          if ! git diff --cached --quiet; then
            git commit -m "chore(free): publish signed encrypted v2 catalog"
            git push origin HEAD:main
          fi
